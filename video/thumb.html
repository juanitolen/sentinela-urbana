<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0B1220;font-family:'Fira Sans',sans-serif;color:#E6EDF7;position:relative}
.shot{position:absolute;right:-120px;top:70px;width:900px;border-radius:16px;border:2px solid #26324A;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:perspective(1400px) rotateY(-14deg) rotateX(4deg)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0B1220 38%,rgba(11,18,32,.85) 55%,rgba(11,18,32,0) 80%)}
.glow{position:absolute;left:-200px;top:-200px;width:800px;height:800px;background:radial-gradient(circle,rgba(56,189,248,.22),transparent 60%)}
.c{position:absolute;left:64px;top:70px;width:640px}
.brand{display:flex;align-items:center;gap:14px;font:600 22px 'Fira Code';color:#38BDF8;letter-spacing:.02em}
h1{font-size:96px;line-height:.95;margin:26px 0 18px;font-weight:800;letter-spacing:-.03em}
h1 span{color:#38BDF8}
p{font-size:30px;color:#B6C2D4;margin:0 0 34px;line-height:1.25;font-weight:500}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{font:600 22px 'Fira Sans';padding:10px 18px;border-radius:30px;border:2px solid}
.a{color:#38BDF8;border-color:#38BDF8;background:rgba(56,189,248,.1)}.b{color:#FB923C;border-color:#FB923C;background:rgba(251,146,60,.1)}.d{color:#FACC15;border-color:#FACC15;background:rgba(250,204,21,.1)}
.foot{position:absolute;left:64px;bottom:48px;font:600 24px 'Fira Code';color:#8796AD}
.foot b{color:#E6EDF7}
.badge{position:absolute;right:56px;bottom:44px;background:#F87171;color:#1A0505;font:800 28px 'Fira Sans';padding:10px 20px;border-radius:12px}
</style></head><body>
<div class="glow"></div>
<img class="shot" src="../docs/telas/T02-painel.png">
<div class="fade"></div>
<div class="c">
 <div class="brand"><svg width="44" height="44" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="#38BDF8" stroke-width="2" opacity=".45"/><circle cx="16" cy="16" r="6" fill="none" stroke="#38BDF8" stroke-width="2"/><circle cx="16" cy="16" r="2.4" fill="#F59E0B"/></svg>URBAN RISK INTELLIGENCE</div>
 <h1>Sentinela<br><span>Urbana</span></h1>
 <p>Alertas de risco urbano com origem e nível de confiança de cada dado</p>
 <div class="chips"><span class="chip a">Alagamentos</span><span class="chip b">Ilhas de calor</span><span class="chip d">Energia · Água · Transporte</span></div>
</div>
<div class="foot"><b>GS 2026.2</b> · Engenharia de Software · FIAP</div>
<div class="badge">DEMO</div>
</body></html>
